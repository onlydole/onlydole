---
name: Lint

on:
  pull_request:
    branches:
      - main
  # Agents push straight to main. Refresh commits made with GITHUB_TOKEN
  # don't trigger workflows, so this fires for human, agent, and merge pushes.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAVE_SUPER_LINTER_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          # One Lint check instead of 20 serial commit-status posts. The job
          # summary still names each linter.
          MULTI_STATUS: false
          # PRs and pushes lint their own diff, so a linter upgrade doesn't
          # fail on untouched files. A manual dispatch sweeps the repo.
          # Trivy, Biome, and Checkov scan the whole workspace regardless.
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' }}
          MARKDOWN_CONFIG_FILE: .markdownlint.yaml
          # Config paths resolve under .github/linters. Without this,
          # super-linter lints with ruff's default rules, not ruff.toml.
          PYTHON_RUFF_CONFIG_FILE: ../../ruff.toml
          FILTER_REGEX_EXCLUDE: (assets/|tests/goldens/|tests/fixtures/)
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          VALIDATE_JSCPD: false
          # README.md is generated by build.py; prettier fights the generator
          # on every bot refresh. markdownlint still validates it.
          VALIDATE_MARKDOWN_PRETTIER: false
