---
name: Link Checker

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-checker
  cancel-in-progress: false

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress './**/*.md' './**/*.html' './**/*.rst'
          output: lychee/out.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the link report
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          report_number=$(gh issue list --state open --label 'automated issue' --json number,title --jq '.[] | select(.title == "Link Checker Report") | .number' | head -n 1)
          if [ -n "$report_number" ]; then
            gh issue edit "$report_number" --body-file lychee/out.md
          else
            gh issue create --title 'Link Checker Report' --body-file lychee/out.md --label report --label 'automated issue'
          fi
