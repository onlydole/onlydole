---
name: Link Checker

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-checker
  cancel-in-progress: false

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress './**/*.md'
          output: lychee/out.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Opens the report on the first failure, updates it while links stay
      # broken, and closes it once they recover.
      - name: Sync the link report issue
        if: steps.lychee.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LYCHEE_EXIT: ${{ steps.lychee.outputs.exit_code }}
        run: |
          number=$(gh issue list --state open --search 'in:title "Link Checker Report"' \
            --json number,title \
            --jq '.[] | select(.title == "Link Checker Report") | .number' | head -n 1)
          if [ "$LYCHEE_EXIT" != 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file lychee/out.md
            else
              gh issue create --title 'Link Checker Report' --body-file lychee/out.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All links pass as of run $GITHUB_RUN_ID."
          fi
