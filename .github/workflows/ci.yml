---
name: CI

on:
  push:
    branches:
      - main
    paths:
      - "generator/**"
      - "tests/**"
      - "ruff.toml"
      - "conftest.py"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known

      - name: Run tests
        run: uv run --locked --project generator pytest tests/ -v

      - name: Lint generator
        run: uv run --locked --project generator ruff check .

      - name: Check generator formatting
        run: uv run --locked --project generator ruff format --check .
