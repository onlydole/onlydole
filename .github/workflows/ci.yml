---
name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run tests
        run: uv run --locked --project generator pytest tests/ -v

      - name: Lint generator
        run: uv run --locked --project generator ruff check generator tests

      - name: Check generator formatting
        run: uv run --locked --project generator ruff format --check generator tests
