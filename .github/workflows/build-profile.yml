---
name: Build profile

on:
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generator/**"
      - ".github/workflows/build-profile.yml"

permissions: {}

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      # Keeps print() in order with stderr warnings and their timestamps.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known

      - name: Test generator before rebuilding
        run: uv run --locked --project generator pytest tests/ -q

      - name: Rebuild dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked --project generator python generator/build.py

      # The ruleset on main requires verified signatures, which rejects plain
      # `git push` from Actions. createCommitOnBranch commits are signed by
      # GitHub, so the refresh lands with a Verified badge instead.
      - name: Commit via API if changed
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked --project generator python generator/api_commit.py

      # A stale source keeps its last-good data, so it opens an issue instead
      # of failing the run. The issue updates while sources stay stale and
      # closes once they recover.
      - name: Check source freshness
        id: health
        run: >-
          uv run --locked --project generator
          python -m generator.health --report "$RUNNER_TEMP/health.md"

      - name: Sync the stale sources issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STALE: ${{ steps.health.outputs.stale }}
          TITLE: Profile sources past the refresh budget
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$STALE" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$RUNNER_TEMP/health.md"
            else
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/health.md"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" \
              --comment "Every source is within budget as of run $GITHUB_RUN_ID."
          fi
