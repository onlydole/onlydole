---
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
# checkov:skip=CKV_GHA_7:the console passes the prompt via dispatch inputs
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
        required: true
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run agent
        uses: pullfrog/pullfrog@0657d542f2e34565c6254d5c84581313e631cd90 # v0.1.57
        with:
          prompt: ${{ inputs.prompt }}
          model: openai-compatible/byok
          push: restricted
        env:
          OPENAI_COMPATIBLE_BASE_URL: https://ollama.com/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: deepseek-v4-pro:0813-cloud
          # DeepSeek V4 Pro limits — Pullfrog requires both.
          # Output is the 65536 cap Ollama Cloud enforces, not the 384K
          # the model spec advertises (ollama/ollama#16890).
          OPENAI_COMPATIBLE_CONTEXT: "1000000"
          OPENAI_COMPATIBLE_MAX_OUTPUT: "65536"
