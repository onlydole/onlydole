---
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
# checkov:skip=CKV_GHA_7:the console passes the prompt via dispatch inputs
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
        required: true
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run agent
        uses: pullfrog/pullfrog@86f7dba19a2e8fddcc11c703e3fd906d8deae145 # v0.1.64
        with:
          prompt: ${{ inputs.prompt }}
          model: openai-compatible/byok
          push: restricted
        env:
          OPENAI_COMPATIBLE_BASE_URL: https://ollama.com/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: glm-5.3-flash:cloud
          # GLM 5.3 Flash limits — Pullfrog requires both. Context is the 1M
          # window the Ollama library page lists for glm-5.3-flash:cloud.
          # Output is GLM-5.3-Flash's documented ceiling — docs.z.ai lists
          # 65536 default, 131072 maximum.
          OPENAI_COMPATIBLE_CONTEXT: "1048576"
          OPENAI_COMPATIBLE_MAX_OUTPUT: "131072"
