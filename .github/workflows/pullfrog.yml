name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@0657d542f2e34565c6254d5c84581313e631cd90 # v0.1.57
        with:
          prompt: ${{ inputs.prompt }}
          model: openai-compatible/byok
        env:
          OPENAI_COMPATIBLE_BASE_URL: https://ollama.com/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: glm-5.2
          # Pullfrog needs the model's real limits: GLM 5.2 serves 1M
          # context and 128K max output (docs.z.ai)
          OPENAI_COMPATIBLE_CONTEXT: "1000000"
          OPENAI_COMPATIBLE_MAX_OUTPUT: "128000"
