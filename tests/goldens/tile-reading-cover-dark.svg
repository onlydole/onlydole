<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-label="Currently-reading shelf on Goodreads: Fixture book (Fixture author)">
  <title>Currently-reading shelf on Goodreads: Fixture book (Fixture author)</title>
  <style>
    .icon { fill: none; stroke: #ff9d76; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .fit { transform-box: fill-box; transform-origin: center; }
    .turn { transform-box: fill-box; transform-origin: left center; }
    @keyframes draw { from { stroke-dasharray: 1 1.1; stroke-dashoffset: 1.1; } to { stroke-dasharray: 1 1.1; stroke-dashoffset: 0; } }
    @keyframes write { 0% { stroke-dasharray: 1 1.1; stroke-dashoffset: 1.1; } 7%, 100% { stroke-dasharray: 1 1.1; stroke-dashoffset: 0; } }
    @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.3); } to { transform: scale(1); } }
    @keyframes beat { 0%, 9%, 100% { transform: scale(1); } 4% { transform: scale(1.5); } }
    @keyframes ring { 0% { opacity: .6; transform: scale(1); } 9%, 100% { opacity: 0; transform: scale(2.6); } }
    @keyframes talk { 0%, 13%, 100% { transform: scaleY(1); } 2% { transform: scaleY(1.7); } 4% { transform: scaleY(.45); } 6% { transform: scaleY(1.45); } 8% { transform: scaleY(.7); } 10.5% { transform: scaleY(1.25); } }
    @keyframes wave-l { 0%, 100% { opacity: 0; transform: none; } 3%, 9% { opacity: .9; } 6%, 12% { opacity: 0; transform: translateX(-7px); } 6.01% { transform: none; } }
    @keyframes wave-r { 0%, 100% { opacity: 0; transform: none; } 3%, 9% { opacity: .9; } 6%, 12% { opacity: 0; transform: translateX(7px); } 6.01% { transform: none; } }
    @keyframes turn { 0% { opacity: 0; transform: scaleX(1); } 1% { opacity: 1; } 9% { opacity: 1; transform: scaleX(-1); } 10%, 100% { opacity: 0; transform: scaleX(-1); } }
    @keyframes sheen { 0% { opacity: 0; transform: translateX(-150px); } 2% { opacity: 1; } 11% { opacity: 1; transform: translateX(150px); } 12%, 100% { opacity: 0; transform: translateX(150px); } }
    @keyframes nudge { 0%, 7%, 100% { transform: none; } 3.5% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: no-preference) {
      .enter { animation: draw .9s cubic-bezier(.65, 0, .35, 1) 0.63s backwards; }
      .land { animation: pop .4s cubic-bezier(.3, .7, .4, 1) 1.33s backwards; }
      .write { animation: draw .9s cubic-bezier(.65, 0, .35, 1) 0.63s backwards, write 12.0s ease-in-out var(--d) 3; }
      .talk { animation: pop .4s cubic-bezier(.3, .7, .4, 1) 1.33s backwards, talk 12.0s ease-in-out var(--d) 3; }
      .beat { animation: pop .4s cubic-bezier(.3, .7, .4, 1) 1.33s backwards, beat 12.0s ease-in-out var(--d) 3; }
      .ring { animation: ring 12.0s ease-in-out var(--d) 3; }
      .wave-l { animation: wave-l 12.0s ease-in-out var(--d) 3; }
      .wave-r { animation: wave-r 12.0s ease-in-out var(--d) 3; }
      .turn { animation: turn 12.0s ease-in-out var(--d) 3; }
      .sheen { animation: sheen 12.0s ease-in-out var(--d) 3; }
      .nudge { animation: nudge 12.0s ease-in-out var(--d) 3; }
    }
  </style>
  <defs>
    <linearGradient id="wash" x2="1">
      <stop stop-color="#ff9d76" stop-opacity="0.25"/>
      <stop offset="0.72" stop-color="#1d1816" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="fibers" width="24" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="0.8" fill="#f7efe5" fill-opacity="0.07"/>
      <circle cx="19" cy="16" r="0.7" fill="#ff9d76" fill-opacity="0.09"/>
      <path d="M8 19 l6 -1 M1 11 l4 0.5" stroke="#f7efe5" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="cover"><rect x="36" y="24" width="94" height="128" rx="2"/></clipPath>
    <linearGradient id="sheen" x2="1">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="174" rx="8" fill="#1d1816" stroke="#ff9d76" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="172" rx="7" fill="url(#wash)"/>
  <rect x="2" y="2" width="1196" height="172" rx="7" fill="url(#fibers)"/>

  <rect x="28" y="16" width="108" height="144" rx="6" fill="#ff9d76" fill-opacity="0.14" stroke="#ff9d76" stroke-opacity="0.35"/>
  <image x="36" y="24" width="94" height="128" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="/>
  <g clip-path="url(#cover)" aria-hidden="true">
    <g transform="skewX(-14)">
      <rect x="-20" y="10" width="100" height="160" fill="url(#sheen)" opacity="0" class="sheen" style="--d: 12.8s"/>
    </g>
  </g>

  <path d="M150 24 V152" stroke="#ff9d76" stroke-opacity="0.36"/>
  <text x="174" y="51" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#ff9d76">ON MY BOOKSHELF</text>
  <text x="1162" y="51" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="0.4" fill="#b9a69c">via Goodreads</text>

  <text x="174" y="92" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="29" font-weight="700" fill="#f7efe5">Fixture book</text>

  <text x="174" y="132" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="0.6" fill="#b9a69c">Fixture author</text>
  <g class="nudge" style="--d: 13.100000000000001s">
    <text x="1104" y="94" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.3" fill="#ff9d76">EXPLORE</text>
    <path d="M1124 88 H1161 M1150 77 L1161 88 L1150 99" fill="none" stroke="#ff9d76" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
