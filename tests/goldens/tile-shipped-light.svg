    <circle class="fit" cx="-14" cy="21" r="6" fill="#c2414f" stroke="none" opacity="0" style="animation: ring 12.0s ease-out 8.85s 3"/>
    <circle class="fit" cx="-14" cy="21" r="6" fill="#c2414f" stroke="none" style="animation: pop .4s cubic-bezier(.3, .7, .4, 1) 1.0899999999999999s backwards, beat 12.0s ease-in-out 8.8s 3"/>

